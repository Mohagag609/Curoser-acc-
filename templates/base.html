<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}لوحة التحكم{% endblock %}</title>
    <!-- Google Fonts (Light theme) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind config (before CDN) -->
    <script>
      tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial'],
            }
          }
        }
      }
    </script>
    <!-- Tailwind CSS: built file if present, plus CDN fallback for Render -->
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 font-sans">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="hidden md:flex md:flex-col w-64 bg-white/90 backdrop-blur border-l border-slate-200 p-4">
        <div class="mb-6">
          <div class="text-2xl font-bold tracking-tight">ACC</div>
          <div class="text-xs text-slate-500">Modern Dashboard</div>
        </div>
        <nav class="space-y-1 text-sm">
          <a href="/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">🏠 الصفحة الرئيسية</a>
          <a href="/customers/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">👤 العملاء</a>
          <a href="/units/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">🏢 الوحدات</a>
          <a href="/contracts/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">📝 العقود</a>
          <a href="/installments/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">💳 الأقساط</a>
          <a href="/vouchers/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">🧾 السندات</a>
          <a href="/treasury/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">💼 الخزينة</a>
          <a href="/reports/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">📊 التقارير</a>
          <a href="/admin/" class="nav-link block px-3 py-2 rounded hover:bg-slate-100">⚙️ الإدارة</a>
        </nav>
        <div class="mt-auto pt-4 text-xs text-slate-400">© {{ now|default:'' }}</div>
      </aside>
      <!-- Main -->
      <main class="flex-1 p-4 md:p-8">
        <header class="mb-4 md:mb-8">
          <div class="flex items-center justify-between">
            <h1 class="text-xl md:text-3xl font-extrabold">{% block page_title %}لوحة التحكم{% endblock %}</h1>
            <div class="flex items-center gap-2">
              <a href="/admin/" class="px-3 py-1.5 rounded bg-slate-900 text-white">لوحة الإدارة</a>
            </div>
          </div>
        </header>
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      // Highlight active link
      (function(){
        const path = location.pathname.replace(/\/$/, '') || '/';
        document.querySelectorAll('.nav-link').forEach(a=>{
          const href = a.getAttribute('href').replace(/\/$/, '') || '/';
          if (href === path || (href!== '/' && path.startsWith(href))) {
            a.classList.add('bg-slate-900','text-white');
          }
        })
      })();
    </script>
  </body>
  </html>
