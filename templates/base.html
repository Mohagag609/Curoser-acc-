<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}لوحة التحكم{% endblock %}</title>
    <!-- Tailwind CSS: use built file if present, plus CDN fallback for Render -->
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="flex min-h-screen">
      <aside class="w-64 bg-white border-l border-slate-200 p-4 hidden md:block">
        <div class="mb-6">
          <div class="text-xl font-bold">acc_modern</div>
          <div class="text-xs text-slate-500">Django + HTMX</div>
        </div>
        <nav class="space-y-2">
          <a href="/" class="block px-3 py-2 rounded hover:bg-slate-100">الصفحة الرئيسية</a>
          <a href="/customers/" class="block px-3 py-2 rounded hover:bg-slate-100">العملاء</a>
          <a href="/units/" class="block px-3 py-2 rounded hover:bg-slate-100">الوحدات</a>
          <a href="/contracts/" class="block px-3 py-2 rounded hover:bg-slate-100">العقود</a>
          <a href="/vouchers/" class="block px-3 py-2 rounded hover:bg-slate-100">السندات</a>
          <a href="/partners/" class="block px-3 py-2 rounded hover:bg-slate-100">الشركاء</a>
          <a href="/treasury/" class="block px-3 py-2 rounded hover:bg-slate-100">الخزينة</a>
          <a href="/reports/" class="block px-3 py-2 rounded hover:bg-slate-100">التقارير</a>
          <a href="/admin/" class="block px-3 py-2 rounded hover:bg-slate-100">الإدارة</a>
        </nav>
      </aside>
      <main class="flex-1 p-4 md:p-6">
        <header class="mb-4 md:mb-6">
          <div class="flex items-center justify-between">
            <h1 class="text-lg md:text-2xl font-bold">{% block page_title %}لوحة التحكم{% endblock %}</h1>
            <div class="hidden md:flex items-center gap-2">
              <a href="/admin/" class="px-3 py-1.5 rounded bg-slate-900 text-white">الإدارة</a>
            </div>
          </div>
        </header>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
  </html>
