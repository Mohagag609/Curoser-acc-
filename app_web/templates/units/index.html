{% extends 'base.html' %}
{% block title %}الوحدات{% endblock %}
{% block page_title %}الوحدات{% endblock %}
{% block content %}
<div class="bg-white rounded shadow p-4">
  <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-3 mb-4">
    <input id="u-q" name="q" class="border rounded px-3 py-2 flex-1" placeholder="بحث بالاسم/الكود..." hx-get="{% url 'units_table' %}" hx-target="#u-table" hx-trigger="keyup changed delay:300ms" />
    <button class="px-4 py-2 rounded bg-slate-900 text-white"
            hx-get="{% url 'unit_form' %}" hx-target="#u-form" hx-swap="innerHTML">إضافة وحدة</button>
  </div>
  <div id="u-form" class="mb-4"></div>
  <div id="u-table" hx-get="{% url 'units_table' %}" hx-trigger="load"></div>
</div>
{% endblock %}
