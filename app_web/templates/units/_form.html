<form class="bg-slate-50 border rounded p-3"
      hx-post="{% if obj %}{% url 'unit_update' obj.pk %}{% else %}{% url 'unit_create' %}{% endif %}"
      hx-target="#u-table" hx-swap="outerHTML">
  {% csrf_token %}
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <div>
      <label class="text-xs text-slate-500">الكود</label>
      {{ form.code }}
      <div class="text-xs text-slate-400">إن تركته فارغًا سنولّده تلقائيًا</div>
    </div>
    <div>
      <label class="text-xs text-slate-500">الاسم</label>
      {{ form.name }}
    </div>
    <div>
      <label class="text-xs text-slate-500">البرج</label>
      {{ form.building }}
    </div>
    <div>
      <label class="text-xs text-slate-500">الدور</label>
      {{ form.floor }}
    </div>
    <div>
      <label class="text-xs text-slate-500">النوع</label>
      {{ form.unit_type }}
    </div>
    <div>
      <label class="text-xs text-slate-500">السعر</label>
      {{ form.total_price }}
    </div>
    <div class="md:col-span-3">
      <label class="text-xs text-slate-500">ملاحظات</label>
      {{ form.notes }}
    </div>
  </div>
  <div class="mt-3 flex gap-2">
    <button class="px-4 py-2 rounded bg-slate-900 text-white">حفظ</button>
    <button class="px-4 py-2 rounded bg-slate-200" type="button" onclick="document.querySelector('#u-form').innerHTML=''">إلغاء</button>
  </div>
  {% if form.errors %}
    <div class="mt-2 text-red-600 text-sm">برجاء تصحيح الأخطاء.</div>
  {% endif %}
</form>
