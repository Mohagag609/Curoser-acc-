<table class="min-w-full text-sm">
  <thead>
    <tr class="text-right text-slate-500">
      <th class="py-2">الوحدة</th>
      <th class="py-2">النوع</th>
      <th class="py-2">الأصلي</th>
      <th class="py-2">المتبقي</th>
      <th class="py-2">الاستحقاق</th>
      <th class="py-2 w-48">دفع</th>
    </tr>
  </thead>
  <tbody>
    {% for i in installments %}
    <tr class="border-t">
      <td class="py-2">{{ i.unit.code }}</td>
      <td class="py-2">{{ i.type }}</td>
      <td class="py-2">{{ i.original_amount }}</td>
      <td class="py-2">{{ i.amount_remaining }}</td>
      <td class="py-2">{{ i.due_date }}</td>
      <td class="py-2">
        {% if i.status != 'مدفوع' %}
        <form hx-post="{% url 'installment_pay' i.pk %}" hx-target="#i-table" class="flex gap-2">
          <input type="number" name="amount" step="0.01" min="0" value="{{ i.amount_remaining }}" class="border rounded px-2 py-1 w-24">
          <input type="date" name="date" value="{{ i.due_date|default:today }}" class="border rounded px-2 py-1">
          <select name="safe" class="border rounded px-2 py-1">
            {% for s in safes %}{% endfor %}
          </select>
          <button class="px-3 py-1 rounded bg-slate-900 text-white">دفع</button>
        </form>
        {% else %}
        <span class="text-green-700">مدفوع</span>
        {% endif %}
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="6" class="py-6 text-center text-slate-500">لا توجد بيانات</td></tr>
    {% endfor %}
  </tbody>
</table>
