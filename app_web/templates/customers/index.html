{% extends 'base.html' %}
{% block title %}العملاء{% endblock %}
{% block page_title %}العملاء{% endblock %}
{% block content %}
<div class="bg-white rounded shadow p-4">
  <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-3 mb-4">
    <input id="c-q" name="q" class="border rounded px-3 py-2 flex-1" placeholder="بحث بالاسم..." hx-get="{% url 'customers_table' %}" hx-target="#c-table" hx-trigger="keyup changed delay:300ms" />
    <button class="px-4 py-2 rounded bg-slate-900 text-white"
            hx-get="{% url 'customer_form' %}" hx-target="#c-form" hx-swap="innerHTML">
      إضافة عميل
    </button>
  </div>
  <div id="c-form" class="mb-4"></div>
  <div id="c-table" hx-get="{% url 'customers_table' %}" hx-trigger="load">
    <!-- جدول العملاء سيحمّل هنا -->
  </div>
{% endblock %}
