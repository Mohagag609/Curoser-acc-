<form class="bg-slate-50 border rounded p-3"
      hx-post="{% if obj %}{% url 'customer_update' obj.pk %}{% else %}{% url 'customer_create' %}{% endif %}"
      hx-target="#c-table" hx-swap="outerHTML">
  {% csrf_token %}
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <div>
      <label class="text-xs text-slate-500">الاسم</label>
      {{ form.name }}
    </div>
    <div>
      <label class="text-xs text-slate-500">الهاتف</label>
      {{ form.phone }}
    </div>
    <div>
      <label class="text-xs text-slate-500">الرقم القومي</label>
      {{ form.national_id }}
    </div>
    <div class="md:col-span-2">
      <label class="text-xs text-slate-500">العنوان</label>
      {{ form.address }}
    </div>
    <div>
      <label class="text-xs text-slate-500">الحالة</label>
      {{ form.status }}
    </div>
    <div class="md:col-span-3">
      <label class="text-xs text-slate-500">ملاحظات</label>
      {{ form.notes }}
    </div>
  </div>
  <div class="mt-3 flex gap-2">
    <button class="px-4 py-2 rounded bg-slate-900 text-white">حفظ</button>
    <button class="px-4 py-2 rounded bg-slate-200" type="button" onclick="document.querySelector('#c-form').innerHTML=''">إلغاء</button>
  </div>
  {% if form.errors %}
    <div class="mt-2 text-red-600 text-sm">برجاء تصحيح الأخطاء.</div>
  {% endif %}
</form>
