<table class="min-w-full text-sm">
  <thead>
    <tr class="text-right text-slate-500">
      <th class="py-2">التاريخ</th>
      <th class="py-2">النوع</th>
      <th class="py-2">المبلغ</th>
      <th class="py-2">البيان</th>
      <th class="py-2">الخزنة</th>
    </tr>
  </thead>
  <tbody>
    {% for v in vouchers %}
    <tr class="border-t">
      <td class="py-2">{{ v.date }}</td>
      <td class="py-2">{{ v.type }}</td>
      <td class="py-2">{{ v.amount }}</td>
      <td class="py-2">{{ v.description }}</td>
      <td class="py-2">{{ v.safe.name }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="py-6 text-center text-slate-500">لا توجد بيانات</td></tr>
    {% endfor %}
  </tbody>
</table>
