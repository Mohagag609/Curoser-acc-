{% extends 'base.html' %}
{% block title %}الخزينة{% endblock %}
{% block page_title %}الخزينة{% endblock %}
{% block content %}
<div class="bg-white rounded shadow p-4">
  <form class="flex gap-2 mb-4" hx-post="{% url 'safe_create' %}" hx-target="#s-table">
    {% csrf_token %}
    <input name="name" class="border rounded px-3 py-2" placeholder="اسم الخزنة">
    <input name="balance" class="border rounded px-3 py-2" type="number" step="0.01" value="0" placeholder="الرصيد">
    <button class="px-4 py-2 rounded bg-slate-900 text-white">إضافة</button>
  </form>
  <div id="s-table" hx-get="{% url 'safes_table' %}" hx-trigger="load"></div>
</div>
{% endblock %}
